<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add pricelist 1</title><link rel="stylesheet" href="../tokens.css"><script src="../data.js"></script>
<style>.steps{padding:0 16px 14px}.steps .lab{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px}.steps .bar{display:flex;gap:6px}.steps .bar i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps .bar i.on{background:var(--accent)}.h2{padding:0 16px 14px;font-size:24px;font-weight:700;letter-spacing:-.02em}.topbar h1{font-size:17px;text-align:center;flex:1}.topbar .sp{width:44px}.actionbar{padding-bottom:24px}.actionbar .btn{flex:1}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid #aeb7b1;flex:none}
.sel .radio{border-color:var(--accent);background:radial-gradient(var(--accent) 0 42%,transparent 46%)}
.row.sel{background:var(--accent-soft)}
.scroll{padding-top:0}
</style></head><body><div class="app">
<div class="statusbar"><span>9:41</span><span style="display:flex;gap:6px;font-size:15px"><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-full"></i></span></div>
<div class="topbar"><a class="iconbtn"><i class="ph ph-x"></i></a><h1>Add pricelist</h1><span class="sp"></span></div>
<div class="steps"><div class="lab"><span>Step 1 of 3</span><span>Choose factory</span></div><div class="bar"><i class="on"></i><i></i><i></i></div></div>
<div class="h2">Which factory is this for?</div>
<div class="scroll" style="padding-top:0">
<div class="search"><i class="ph ph-magnifying-glass"></i>Search factories</div>
<div class="list" style="margin-top:14px" id="fl">
<div class="row" style="min-height:64px"><div class="avatar" style="background:var(--surface-2);color:var(--text-2)"><i class="ph-bold ph-plus"></i></div><div class="grow"><div class="t" style="color:var(--accent)">New factory</div><div class="s">Add a factory that is not listed</div></div><i class="ph ph-caret-right" style="color:var(--text-3);font-size:18px"></i></div>
</div></div>
<div class="actionbar"><a class="btn btn-primary">Continue<i class="ph-bold ph-arrow-right"></i></a></div>
</div>
<script>
var h='';DATA.factories.forEach(function(f,i){h+='<div class="row'+(i==0?' sel':'')+'" style="min-height:64px"><div class="avatar">'+f.name[0]+'</div><div class="grow"><div class="t">'+f.name+'</div><div class="s">'+f.city+' &middot; '+f.category+'</div></div><span class="radio"></span></div>'});
document.getElementById('fl').insertAdjacentHTML('afterbegin',h);
</script></body></html>
