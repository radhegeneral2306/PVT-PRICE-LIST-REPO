<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Settings</title>
<link rel="stylesheet" href="../tokens.css"><script src="../data.js"></script>
<style>
.scroll{padding-top:0}.topbar{padding:2px 16px 8px}.topbar h1{font-size:20px}
.section-title{margin:10px 2px 5px}.scroll{padding-bottom:0}
.row{min-height:46px;padding:6px 14px}.row .avatar{width:32px;height:32px;font-size:13px;border-radius:10px}.row .s{margin-top:0;font-size:12px}
.row i.l{font-size:20px;color:var(--text-2);width:22px;flex:none}
.row .t{font-weight:500}
.tg{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tg.on{background:var(--accent)}.tg.on::after{left:23px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:var(--r-md);padding:3px;gap:2px;width:100%}
.seg span{height:36px;display:grid;place-items:center;border-radius:9px;font-size:14px;font-weight:500;color:var(--text-2)}
.seg span.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.addrow{color:var(--accent)}.addrow .t,.addrow i.l{color:var(--accent)}
.sm{height:36px;font-size:14px;padding:0 14px}
.badge.owner{background:var(--accent-soft);color:var(--accent)}
</style></head><body>
<div class="app">
<div class="statusbar"><span>9:41</span><span><i class="ph-fill ph-cell-signal-full"></i> <i class="ph-fill ph-wifi-high"></i> <i class="ph-fill ph-battery-full"></i></span></div>
<div class="topbar"><h1>Settings</h1></div>
<div class="scroll">
  <div class="section-title" style="margin-top:0">Account</div>
  <div class="list"><div class="row"><div class="avatar" id="av"></div><div class="grow"><div class="t"><span id="un"></span> <span style="font-weight:400;color:var(--text-2)">at Radhe General</span></div></div><span class="badge ok"><i class="ph-bold ph-crown-simple"></i>Owner</span></div></div>

  <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">Users <span class="badge"><i class="ph-bold ph-lock-simple"></i>Owner only</span></div>
  <div class="list" id="users"></div>

  <div class="section-title">Visibility</div>
  <div class="list">
    <div class="row"><div class="grow"><div class="t">Hide cost rates from staff</div></div><div class="tg on"></div></div>
    <div class="row"><div class="grow"><div class="t">Show stale warning after 3 weeks</div></div><div class="tg on"></div></div>
  </div>

  <div class="section-title">Sync</div>
  <div class="list">
    <div class="row"><i class="ph ph-cloud-check l" style="color:var(--accent)"></i><div class="grow"><div class="t">Synced 2 min ago</div><div class="s">Works offline</div></div><span class="btn sm"><i class="ph-bold ph-arrows-clockwise"></i>Sync now</span></div>
  </div>

  <div class="section-title">Appearance</div>
  <div class="list"><div class="row" style="padding:5px 6px;min-height:0"><div class="seg"><span class="on">Light</span><span>Dark</span><span>System</span></div></div></div>

  <div class="list" style="margin-top:10px">
    <div class="row"><i class="ph ph-download-simple l"></i><div class="grow t">Install app on this phone</div><i class="ph ph-caret-right" style="color:var(--text-3)"></i></div>
    <div class="row"><i class="ph ph-sign-out l" style="color:var(--danger)"></i><div class="grow t" style="color:var(--danger)">Sign out</div></div>
  </div>
</div>
<div class="tabbar">
<div class="tab"><i class="ph ph-house"></i>Home</div>
<div class="tab"><i class="ph ph-factory"></i>Factories</div>
<div class="tab"><i class="ph ph-magnifying-glass"></i>Search</div>
<div class="tab active"><i class="ph-fill ph-gear"></i>Settings</div>
</div></div>
<script>
document.getElementById('av').textContent=DATA.user.name[0];document.getElementById('un').textContent=DATA.user.name;
document.getElementById('users').innerHTML=DATA.users.map(u=>`<div class="row"><div class="avatar">${u.name[0]}</div><div class="grow"><div class="t">${u.name} <span style="font-weight:400;font-size:13px;color:var(--text-2);margin-left:4px">${u.note||'Sees all rates'}</span></div></div><span class="badge ${u.role==='Owner'?'ok':''}">${u.role}</span></div>`).join('')+
`<div class="row addrow"><i class="ph-bold ph-plus l"></i><div class="grow t">Add user</div></div>`;
</script></body></html>
